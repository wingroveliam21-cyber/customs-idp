name: Strategy execution verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/auditable-customer-strategy-engine]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build application
        run: npm run build
